my that has not been selected to fight this phase.","when":"Fight phase.","effect":"Until the end of the phase, each time an attack made by a model in your unit is allocated to an enemy model, if your unit has the EIGHTBOUND keyword and that enemy model is not a MONSTER or VEHICLE, add 1 to the Damage characteristic of that attack. If your unit has the EXALTED EIGHTBOUND keyword and that enemy model is a MONSTER or VEHICLE, add 1 to the Damage characteristic of that attack instead.","restriction":"","source_page":144,"source_column":1,"source":"Stratagems _ 40k.app.pdf","review_status":"Pending review"},{"name":"ASPIRE TO INFAMY","cp":1,"phase":"Fight Phase","type":"Unspecified","faction_or_detachment":"VESSELS OF WRATH","target":"That WORLD EATERS CHARACTER  unit.","when":"Fight phase, when a friendly WORLD EATERS CHARACTER  unit (excluding EPIC HERO units) is selected to fight.","effect":"Your unit's CHARACTER  models' melee attacks have: +1 A. +2 S.","restriction":"","source_page":144,"source_column":1,"source":"Stratagems _ 40k.app.pdf","review_status":"Pending review"},{"name":"PARTING THE VEIL","cp":2,"phase":"Fight Phase","type":"Strategic Ploy","faction_or_detachment":"DEVOTED OF YNNEAD","target":"One YNNARI unit from your army that was selected as the target of one or more of the attacking unit’s attacks.","when":"Fight phase, just after an enemy unit has selected its targets.","effect":"Until the end of the phase, each time a model in your unit is destroyed, if that model has not fought","restriction":"","source_page":144,"source_column":1,"source":"Stratagems _ 40k.app.pdf","review_status":"Pending review"},{"name":"IMMORTAL FURY","cp":2,"phase":"Fight Phase","type":"Battle Tactic","faction_or_detachment":"POSSESSED SLAUGHTERBAND","target":"One WORLD EATERS POSSESSED unit from your army that was selected as the target of one or more of the attacking unit’s attacks.","when":"Fight phase, just after an enemy unit has selected its targets.","effect":"Until the end of the phase, each time a model in your unit is destroyed, if that model has not fought this phase, do not remove it from play. The destroyed model can fight after the attacking model’s unit has finished making its attacks, and is then removed from play.","restriction":"","source_page":144,"source_column":2,"source":"Stratagems _ 40k.app.pdf","review_status":"Pending review"},{"name":"EMISSARIES OF YNNEAD","cp":1,"phase":"Fight Phase","type":"Battle Tactic","faction_or_detachment":"DEVOTED OF YNNEAD","target":"That YNNARI INFANTRY unit.","when":"Fight phase, just after a YNNARI INFANTRY unit from your army has selected its targets.","effect":"Until the end of the phase, each time a model in your unit makes an attack, re‑roll a Hit roll of 1. If your unit is below its Starting Strength, you can re‑roll the Hit roll instead.","restriction":"","source_page":144,"source_column":2,"source":"Stratagems _ 40k.app.pdf","review_status":"Pending review"}],"missions":[{"name":"Determined Acquisition","matchup":"Take And Hold Vs Disruption","rules_text":"Take And Hold Vs Disruption\nThe resistance arrayed against you is formidable indeed, yet your orders are clear; take and hold the ground ahead,\nheedless of the cost.\nANY BATTLE ROUND - End of your turn.\nFor each objective you control that you did not control at the start of the turn (excluding your\nhome objective).\n2VP\nSECOND BATTLE ROUND ONWARDS - End of your Command phase (or the end of your turn in the fifth battle round).\nFor each objective you control.\n3VP\nFor each of those objectives that is within your opponent’s territory.\n3VP\nSweeping Engagement\nTake and Hold / Disruption - Layout A\nHammer and Anvil\nTake and Hold / Disruption - Layout C\nCrucible Of Battle\nTake and Hold / Disruption - Layout B","source":"Primary Missions _ 40k.app.pdf","source_label":"Chapter Approved 2026–2027 (as printed in supplied PDF)","review_status":"Pending edition/validity review"},{"name":"Outmanoeuvre","matchup":"Disruption Vs Disruption","rules_text":"Disruption Vs Disruption\nSpeed and positioning are key in any battle. Outflank the enemy, seize high ground and routes of resupply. Choke them\nto death.\nANY BATTLE ROUND - End of your turn.\nYou control your opponent’s home objective.\n10VP\nFIRST BATTLE ROUND - End of your turn.\n40K.APP\nRules\nThe core rules of Warhammer 40,000 - the stratagems, missions\nand principles every commander wields on the battlefield.\nFor each objective you control (excluding your home objective).\n4VP\nSECOND AND THIRD BATTLE ROUND - End of your Command phase.\nFor each objective you control (excluding your home objective).\n5VP\nFOURTH BATTLE ROUND ONWARDS - End of your turn.\nFor each objective you control (excluding your home objective).\n6VP\nTipping Point\nDisruption / Disruption - Layout B\nSweeping Engagement\nDisruption / Disruption - Layout C\nCrucible Of Battle\nDisruption / Disruption - Layout A","source":"Primary Missions _ 40k.app.pdf","source_label":"Chapter Approved 2026–2027 (as printed in supplied PDF)","review_status":"Pending edition/validity review"},{"name":"Search And Scour","matchup":"Reconnaissance Vs Priority Assets","rules_text":"Reconnaissance Vs Priority Assets\nForward elements report enemy movement in this sector. Move out, locate the foes and halt their operation before it\ngathers momentum.\nANY BATTLE ROUND - End of your turn.\nYou control one or more central objectives.\n3VP\nOne or more enemy units that started the turn within a terrain area are destroyed.\n2VP\nSECOND BATTLE ROUND ONWARDS - End of your Command phase (or the end of your turn in the fifth battle round).\nFor each objective you control (excluding your home objective).\n4VP\nNo enemy units are wholly within your territory.\n5VP\nCrucible Of Battle\nReconnaissance / Priority Assets - Layout A\nSweeping Engagement\nReconnaissance / Priority Assets - Layout C\nTipping Point\nReconnaissance / Priority Assets - Layout B","source":"Primary Missions _ 40k.app.pdf","source_label":"Chapter Approved 2026–2027 (as printed in supplied PDF)","review_status":"Pending edition/validity review"},{"name":"Triangulation","matchup":"Reconnaissance Vs Purge The Foe","rules_text":"Reconnaissance Vs Purge The Foe\nBy acquiring and transmitting precise coordinates, your forces will be able to summon reinforcements, saturate the\nbattlefield with artillery fire or call in other means of support.\nSECOND BATTLE ROUND ONWARDS - End of your Command phase (or the end of your turn in the fifth battle round).\nYou control one or more objectives (excluding your home objective).\n4VP\nSECOND BATTLE ROUND ONWARDS - End of your turn.\nOne objective is triangulated.\n3VP\nTwo objectives are triangulated.\n6VP\nThree or more objectives are triangulated.\n10VP\nYou control four or more objectives.\n10VP\nHammer and Anvil\nPurge the Foe / Reconnaissance - Layout A\nDawn Of War\nPurge the Foe / Reconnaissance - Layout B\nCrucible Of Battle\nPurge the Foe / Reconnaissance - Layout C\nACTION: TRIANGULATE","source":"Primary Missions _ 40k.app.pdf","source_label":"Chapter Approved 2026–2027 (as printed in supplied PDF)","review_status":"Pending edition/validity review"},{"name":"Immovable Object","matchup":"Take And Hold Vs Purge The Foe","rules_text":"Take And Hold Vs Purge The Foe\nObstinance is often the key to victory. Weather everything the enemy throws at you. If your opponent is to take any\nground, they will have to wade through their own dead to do so.\nANY BATTLE ROUND - End of your turn.\nYou control one or more central objectives.\n3VP\nSECOND TO FOURTH BATTLE ROUND - End of your Command phase\nFor each objective you control (excluding your home objective).\n5VP\nFIFTH BATTLE ROUND - End of your turn.\nFor each objective you control (excluding your home objective).\n5VP\nHammer and Anvil\nTake and Hold / Purge the Foe - Layout C\nSweeping Engagement\nTake and Hold / Purge the Foe - Layout A\nSearch and Destroy\nTake and Hold / Purge the Foe - Layout B","source":"Primary Missions _ 40k.app.pdf","source_label":"Chapter Approved 2026–2027 (as printed in supplied PDF)","review_status":"Pending edition/validity review"},{"name":"Reconnaissance Sweep","matchup":"Reconnaissance Vs Take And Hold","rules_text":"Reconnaissance Vs Take And Hold\nEnemy movements have aroused suspicion. Disperse your forces, probe their lines and decipher their intentions.\nANY BATTLE ROUND - End of your turn.\nThree or more friendly units are wholly within three different table quarters and not within 6\" of the centre of\nthe battlefield.\n3VP\nFour or more friendly units are wholly within four different table quarters and not within 6\" of the centre of\nthe battlefield.\n6VP\nANY BATTLE ROUND - End of your turn.\nFor each enemy unit destroyed this turn.\n1VP\nSECOND BATTLE ROUND ONWARDS - End of your Command phase (or the end of your turn in the fifth battle round).\nYou control one or more objectives (excluding your home objective).\n3VP\nTipping Point\nTake and Hold / Reconnaissance - Layout A\nDawn Of War\nTake and Hold / Reconnaissance - Layout B\nSearch and Destroy\nTake and Hold / Reconnaissance - Layout C","source":"Primary Missions _ 40k.app.pdf","source_label":"Chapter Approved 2026–2027 (as printed in supplied PDF)","review_status":"Pending edition/validity review"},{"name":"Punishment","matchup":"Purge The Foe Vs Disruption","rules_text":"Purge The Foe Vs Disruption\nThose who resist must be punished. Make a bloody example of them, and leave none in doubt as to your mastery.\nSTART OF YOUR TURN: Select one to three enemy units that are on the battlefield and within range of objectives\nand/or that destroyed one or more friendly units in the previous turn. If you cannot, select one enemy unit that is\non the battlefield. Until the start of your next turn, those units are condemned.\nANY BATTLE ROUND - End of a turn.\nOne or more condemned enemy units left the battlefield this turn.\n5VP\nSECOND BATTLE ROUND ONWARDS - End of your Command phase (or the end of your turn in the fifth battle round).\nYou control one or more objectives (excluding your home objective).\n4VP\nYou control more objectives than your opponent.\n5VP\nYou control your opponent’s home objective.\n8VP\nSearch and Destroy\nPurge the Foe / Disruption - Layout A\nSweeping Engagement\nPurge the Foe / Disruption - Layout C\nTipping Point\nPurge the Foe / Disruption - Layout B","source":"Primary Missions _ 40k.app.pdf","source_label":"Chapter Approved 2026–2027 (as printed in supplied PDF)","review_status":"Pending edition/validity review"},{"name":"Secure Asset","matchup":"Priority Assets Vs Take And Hold","rules_text":"Priority Assets Vs Take And Hold\nA vital asset has been lost amidst the chaos of battle. You must secure the item at all costs.\nANY BATTLE ROUND - End of your turn.\nA friendly unit secured the asset this turn.\n4VP\nOne or more enemy units that started the turn within range of one or more central objectives are destroyed.\n2VP\nSECOND BATTLE ROUND ONWARDS - End of your Command phase (or the end of your turn in the fifth battle round).\nYou control one or more objectives (excluding your home objective).\n4VP\nYou control three or more objectives.\n4VP\nCrucible Of Battle\nTake and Hold / Priority Assets - Layout A\nDawn Of War\nTake and Hold / Priority Assets - Layout C\nHammer and Anvil\nTake and Hold / Priority Assets - Layout B\nACTION: SECURE ASSET","source":"Primary Missions _ 40k.app.pdf","source_label":"Chapter Approved 2026–2027 (as printed in supplied PDF)","review_status":"Pending edition/validity review"},{"name":"Gather Intel","matchup":"Reconnaissance Vs Reconnaissance","rules_text":"Reconnaissance Vs Reconnaissance\nThe nature and motivation of the foe remains unclear. Test their mettle and seize pertinent intelligence from the field of\nbattle.\nFIRST BATTLE ROUND - End of your turn.\nYou control one or more central objectives.\n6VP\nSECOND BATTLE ROUND ONWARDS - End of your Command phase (or the end of your turn in the fifth battle round).\nYou control one or more objectives (excluding your home objective).\n4VP\nSECOND BATTLE ROUND ONWARDS - End of your turn.\nFor each friendly unit that completed the Extract Intelligence action this turn.\n7VP\nThree or more of your operation markers are on the battlefield.\n5VP\nOne of your operation markers is within range of your opponent’s home objective.\n5VP\nSweeping Engagement\nReconnaissance / Reconnaissance - Layout A\nCrucible Of Battle\nReconnaissance / Reconnaissance - Layout B\nTipping Point\nReconnaissance / Reconnaissance - Layout C\nACTION: EXTRACT INTELLIGENCE","source":"Primary Missions _ 40k.app.pdf","source_label":"Chapter Approved 2026–2027 (as printed in supplied PDF)","review_status":"Pending edition/validity review"},{"name":"Battlefield Dominance","matchup":"Take And Hold Vs Take And Hold","rules_text":"Take And Hold Vs Take And Hold\nThis battlefield holds great significance for the wider war effort. You must seize control of it. Let nothing stand in your\nway.\nFIRST AND SECOND BATTLE ROUND - End of your turn.\nYou control more objectives than your opponent.\n2VP\nSECOND BATTLE ROUND ONWARDS - End of your Command phase (or the end of your turn in the fifth battle round).\nFor each objective you control.\n3VP\nFor each of those objectives (excluding your home objective) if you control your home objective.\n2VP\nSearch and Destroy\nTake and Hold / Take and Hold - Layout C\nTipping Point\nTake and Hold / Take and Hold - Layout A\nDawn Of War\nTake and Hold / Take and Hold - Layout B","source":"Primary Missions _ 40k.app.pdf","source_label":"Chapter Approved 2026–2027 (as printed in supplied PDF)","review_status":"Pending edition/validity review"},{"name":"Unstoppable Force","matchup":"Purge The Foe Vs Take And Hold","rules_text":"Purge The Foe Vs Take And Hold\nThe enemy are arrayed before you in number, and well prepared for the coming assault. Smash through their defences.\nGrind them to dust.\nANY BATTLE ROUND - End of your turn.\nOne or more enemy units were destroyed this turn.\n3VP\nSECOND BATTLE ROUND ONWARDS - End of your Command phase (or the end of your turn in the fifth battle round).\nFor each objective you control (excluding your home objective).\n4VP\nSECOND BATTLE ROUND ONWARDS - End of your turn.\nYou control one or more objectives you did not control at the start of the turn (excluding your\nhome objective).\n3VP\nYou control one or more central objectives.\n5VP\nHammer and Anvil\nTake and Hold / Purge the Foe - Layout C\nSweeping Engagement\nTake and Hold / Purge the Foe - Layout A\nSearch and Destroy\nTake and Hold / Purge the Foe - Layout B","source":"Primary Missions _ 40k.app.pdf","source_label":"Chapter Approved 2026–2027 (as printed in supplied PDF)","review_status":"Pending edition/validity review"},{"name":"Destroyer'S Wrath","matchup":"Purge The Foe Vs Priority Assets","rules_text":"Purge The Foe Vs Priority Assets\nVictory here shall not be measured in ground taken or plunder seized, but in the mangled corpses of your foes and the\ngrisly trophies hewn from their bodies.\nANY BATTLE ROUND - End of your turn.\nOne or more enemy units were destroyed this turn.\n3VP\nSECOND BATTLE ROUND ONWARDS - End of your Command phase (or the end of your turn in the fifth battle round).\nYou control one or more objectives (excluding your home objective).\n4VP\nYou control more objectives than your opponent.\n6VP\nSECOND BATTLE ROUND ONWARDS - End of your turn.\nMore enemy units were destroyed this turn than friendly units were destroyed in the previous turn.\n4VP\nHammer and Anvil\nPurge the Foe / Priority Assets - Layout C\nDawn Of War\nPurge the Foe / Priority Assets - Layout A\nSearch and Destroy\nPurge the Foe / Priority Assets - Layout B","source":"Primary Missions _ 40k.app.pdf","source_label":"Chapter Approved 2026–2027 (as printed in supplied PDF)","review_status":"Pending edition/validity review"},{"name":"Surveil The Foe","matchup":"Reconnaissance Vs Disruption","rules_text":"Reconnaissance Vs Disruption\nInformation is power. Evaluate the strengths and weaknesses of the enemy and feed this crucial information back to\nyour superiors.\nEach time a friendly unit ends a move within range of one objective that has any of your opponent’s operation\nmarkers within range of it, remove those operation markers from the battlefield.\nANY BATTLE ROUND - End of your turn.\nOne or more enemy units were surveilled this turn, unless each of those units is within range of one or more\nobjectives that have one or more operation markers within range of them.\n4VP\nSECOND BATTLE ROUND ONWARDS - End of your Command phase (or the end of your turn in the fifth battle round).\nYou control one or more objectives (excluding your home objective).\n4VP\nYou control more objectives than your opponent.\n4VP\nSECOND BATTLE ROUND ONWARDS - End of your turn.\nNone of your opponent’s operation markers are on the battlefield.\n5VP\nTipping Point\nDisruption / Reconnaissance - Layout A\nDawn Of War\nDisruption / Reconnaissance - Layout C\nSearch and Destroy\nDisruption / Reconnaissance - Layout B\nACTION: SURVEIL THE FOE","source":"Primary Missions _ 40k.app.pdf","source_label":"Chapter Approved 2026–2027 (as printed in supplied PDF)","review_status":"Pending edition/validity review"},{"name":"Smoke And Mirrors","matchup":"Disruption Vs Reconnaissance","rules_text":"Disruption Vs Reconnaissance\nCunning is as potent a weapon as overwhelming force. Outnumbered or outgunned, you must make use of subterfuge and\nmisdirection to pick the enemy apart.\nANY BATTLE ROUND - End of your turn.\nFor each objective that is decoyed.\n2VP\nFor each of those objectives that is within your opponent’s territory.\n2VP\nSECOND BATTLE ROUND ONWARDS - End of your Command phase (or the end of your turn in the fifth battle round).\nYou control one or more objectives (excluding your home objective).\n4VP\nFour or more objectives are decoyed.\n10VP\nTipping Point\nDisruption / Reconnaissance - Layout A\nDawn Of War\nDisruption / Reconnaissance - Layout C\nSearch and Destroy\nDisruption / Reconnaissance - Layout B\nACTION: DECOY","source":"Primary Missions _ 40k.app.pdf","source_label":"Chapter Approved 2026–2027 (as printed in supplied PDF)","review_status":"Pending edition/validity review"},{"name":"Meatgrinder","matchup":"Purge The Foe Vs Purge The Foe","rules_text":"Purge The Foe Vs Purge The Foe\nVicious and without relent, this battle has descended into base savagery. Only one path to victory remains: kill more of\nthe enemy than they can kill of you.\nANY BATTLE ROUND - End of your turn.\nOne or more enemy units were destroyed this turn.\n3VP\nSECOND BATTLE ROUND ONWARDS - End of your Command phase (or the end of your turn in the fifth battle round).\nYou control one or more objectives (excluding your home objective).\n4VP\nSECOND BATTLE ROUND ONWARDS - End of your turn.\nMore enemy units were destroyed this turn than friendly units were destroyed in the previous turn.\n5VP\nYou control your opponent’s home objective.\n5VP\nSearch and Destroy\nPurge the Foe / Purge the Foe - Layout A\nTipping Point\nPurge the Foe / Purge the Foe - Layout B\nSweeping Engagement\nPurge the Foe / Purge the Foe - Layout C","source":"Primary Missions _ 40k.app.pdf","source_label":"Chapter Approved 2026–2027 (as printed in supplied PDF)","review_status":"Pending edition/validity review"},{"name":"Extract Relic","matchup":"Priority Assets Vs Disruption","rules_text":"Priority Assets Vs Disruption\nA priceless relic saturated with eldritch power lies somewhere on the field of battle. Secure the sensor array at the\nheart of the battlefield and direct its energies to locating the prize.\nANY BATTLE ROUND - End of your turn.\nA friendly unit performed a sensor sweep this turn.\n4VP\nOne or more enemy units that started the turn within range of one or more objectives are destroyed.\n3VP\nOnly one of your opponent’s operation markers is on the battlefield, if one or more of your units are within\nthe same terrain area as that operation marker, and no enemy units are within that terrain area.\n4VP\nSECOND BATTLE ROUND ONWARDS - End of your Command phase (or the end of your turn in the fifth battle round).\nYou control one or more objectives (excluding your home objective).\n4VP\nOnly one of your opponent’s operation markers is on the battlefield, if one or more of your units are within\nthe same terrain area as that operation marker, and no enemy units are within that terrain area.\n5VP\nSweeping Engagement\nDisruption / Priority Assets - Layout A\nTipping Point\nDisruption / Priority Assets - Layout B\nSearch and Destroy\nDisruption / Priority Assets - Layout C\nACTION: SENSOR SWEEP","source":"Primary Missions _ 40k.app.pdf","source_label":"Chapter Approved 2026–2027 (as printed in supplied PDF)","review_status":"Pending edition/validity review"},{"name":"Inescapable Dominion","matchup":"Take And Hold Vs Priority Assets","rules_text":"Take And Hold Vs Priority Assets\nYour first priority must be to dominate the battlefield. Seize strongpoints and dig in. Only then may you turn your full\nattention to slaughtering the foe.\nANY BATTLE ROUND - End of your turn.\nYou control three or more objectives.\n4VP\nSECOND BATTLE ROUND ONWARDS - End of your Command phase (or the end of your turn in the fifth battle round).\nYou control two or more objectives.\n5VP\nYou control more objectives than your opponent.\n4VP\nYou control your opponent’s home objective.\n5VP\nCrucible Of Battle\nTake and Hold / Priority Assets - Layout A\nDawn Of War\nTake and Hold / Priority Assets - Layout C\nHammer and Anvil\nTake and Hold / Priority Assets - Layout B","source":"Primary Missions _ 40k.app.pdf","source_label":"Chapter Approved 2026–2027 (as printed in supplied PDF)","review_status":"Pending edition/validity review"},{"name":"Locate And Deny","matchup":"Disruption Vs Priority Assets","rules_text":"Disruption Vs Priority Assets\nThe enemy is searching for an asset of value. By cunning or by force of arms, prevent its retrieval.\nSTART OF THE BATTLE: Select five terrain areas not within your deployment zone; for each one, place one of your\noperation markers within it. If you cannot, do so for each terrain area that is not within your deployment zone.\nANY BATTLE ROUND - End of your turn.\nOne or more enemy units that started the turn within range of one or more objectives are destroyed.\n4VP\nOnly one of your operation markers is on the battlefield, if one or more of your units are within the same\nterrain area as that marker, and no enemy units are within that terrain area.\n4VP\nSECOND BATTLE ROUND ONWARDS - End of your Command phase (or the end of your turn in the fifth battle round).\nYou control one or more objectives (excluding your home objective).\n4VP\nOnly one of your operation markers is on the battlefield, if one or more of your units are within the same\nterrain area as that marker, and no enemy units are within that terrain area.\n5VP\nSweeping Engagement\nDisruption / Priority Assets - Layout A\nTipping Point\nDisruption / Priority Assets - Layout B\nSearch and Destroy\nDisruption / Priority Assets - Layout C\nACTION: SENSOR SWEEP","source":"Primary Missions _ 40k.app.pdf","source_label":"Chapter Approved 2026–2027 (as printed in supplied PDF)","review_status":"Pending edition/validity review"},{"name":"Consecrate","matchup":"Purge The Foe Vs Reconnaissance","rules_text":"Purge The Foe Vs Reconnaissance\nWhether in the name of grand ideals or simply to satisfy the thirst of their terrible gods, your warriors must consecrate\nthis battlefield with the blood of their foes.\nEach time a friendly unit destroys a unit, that friendly unit becomes a consecration unit. At the end of your turn,\nfor each of your consecration units, you can select one objective it is within range of (excluding your home\nobjective) that has not been consecrated. If you do, place one of your operation markers within range of that\nobjective – that objective is consecrated and that unit is no longer a consecration unit.\nANY BATTLE ROUND - End of your turn.\nOne or two objectives are consecrated.\n3VP\nThree or more objectives are consecrated.\n6VP\nSECOND BATTLE ROUND ONWARDS - End of your Command phase (or the end of your turn in the fifth battle round).\nYou control one or more objectives (excluding your home objective).\n4VP\nYou control more objectives than your opponent.\n4VP\nYour opponent’s home objective is consecrated.\n5VP\nHammer and Anvil\nPurge the Foe / Reconnaissance - Layout A\nDawn Of War\nPurge the Foe / Reconnaissance - Layout B\nCrucible Of Battle\nPurge the Foe / Reconnaissance - Layout C","source":"Primary Missions _ 40k.app.pdf","source_label":"Chapter Approved 2026–2027 (as printed in supplied PDF)","review_status":"Pending edition/validity review"},{"name":"Vital Link","matchup":"Priority Assets Vs Purge The Foe","rules_text":"Priority Assets Vs Purge The Foe\nA key communications node is located in the midst of this battlefield. Control of this node is crucial to the continued\nsuccess of your armies. Ensure it does not fall into enemy hands.\nANY BATTLE ROUND - End of your turn.\nYou control one or more central objectives.\n2VP\nFor each of your operation markers within range of one of those objectives.\n1VP\nSECOND BATTLE ROUND ONWARDS - End of your Command phase (or the end of your turn in the fifth battle round).\nYou control one or more objectives (excluding your home objective).\n4VP\nOne or more of those objectives is a central objective.\n4VP\nYou control your opponent’s home objective.\n10VP\nHammer and Anvil\nPurge the Foe / Priority Assets - Layout C\nDawn Of War\nPurge the Foe / Priority Assets - Layout A\nSearch and Destroy\nPurge the Foe / Priority Assets - Layout B\nACTION: MAINTAIN CONTROL","source":"Primary Missions _ 40k.app.pdf","source_label":"Chapter Approved 2026–2027 (as printed in supplied PDF)","review_status":"Pending edition/validity review"},{"name":"Sabotage","matchup":"Priority Assets Vs Priority Assets","rules_text":"Priority Assets Vs Priority Assets\nStrike deep behind enemy lines, sabotage supply routes, fortifications and heavy weapons. By doing so you may lay the\ngroundwork for future offensives.\nANY BATTLE ROUND - End of your turn.\nFor each friendly unit that committed sabotage this turn.\n3VP\nFor each of those units that is within range of one or more objectives in your opponent’s territory.\n2VP\nSECOND BATTLE ROUND ONWARDS - End of your Command phase (or the end of your turn in the fifth battle round).\nYou control one or more objectives (excluding your home objective).\n4VP\nTipping Point\nPriority Assets / Priority Assets - Layout C\nSweeping Engagement\nPriority Assets / Priority Assets - Layout A\nCrucible Of Battle\nPriority Assets / Priority Assets - Layout B\nACTION: SABOTAGE","source":"Primary Missions _ 40k.app.pdf","source_label":"Chapter Approved 2026–2027 (as printed in supplied PDF)","review_status":"Pending edition/validity review"},{"name":"Vanguard Operation","matchup":"Priority Assets Vs Reconnaissance","rules_text":"Priority Assets Vs Reconnaissance\nStriking deep beyond the front lines, your forces must employ speed and cunning to secure their objectives before the\nenemy responds.\nANY BATTLE ROUND - End of your turn.\nA friendly unit performed a vanguard operation this turn.\n4VP\nOne or more enemy units were destroyed this turn.\n2VP\nSECOND BATTLE ROUND ONWARDS - End of your Command phase (or the end of your turn in the fifth battle round).\nYou control one or more objectives (excluding your home objective).\n4VP\nYou control your opponent’s home objective.\n10VP\nCrucible Of Battle\nReconnaissance / Priority Assets - Layout A\nSweeping Engagement\nReconnaissance / Priority Assets - Layout C\nTipping Point\nReconnaissance / Priority Assets - Layout B\nACTION: VANGUARD OPERATION","source":"Primary Missions _ 40k.app.pdf","source_label":"Chapter Approved 2026–2027 (as printed in supplied PDF)","review_status":"Pending edition/validity review"},{"name":"Delaying Action","matchup":"Disruption Vs Purge The Foe","rules_text":"Disruption Vs Purge The Foe\nYour enemies are on the march. Commit your warriors to battle and make the foe pay a bloody price for every foot of\nground.\nANY BATTLE ROUND - End of your turn.\nFor each enemy unit destroyed this turn.\n2VP\nSECOND BATTLE ROUND ONWARDS - End of your Command phase (or the end of your turn in the fifth battle round).\nYou control one or more objectives (excluding home objectives).\n4VP\nSECOND BATTLE ROUND ONWARDS - End of your turn\nYou control one or more central objectives and one or more expansion objectives.\n3VP\nSearch and Destroy\nPurge the Foe / Disruption - Layout A\nSweeping Engagement\nPurge the Foe / Disruption - Layout C\nTipping Point\nPurge the Foe / Disruption - Layout B","source":"Primary Missions _ 40k.app.pdf","source_label":"Chapter Approved 2026–2027 (as printed in supplied PDF)","review_status":"Pending edition/validity review"},{"name":"Death Trap","matchup":"Disruption Vs Take And Hold","rules_text":"Disruption Vs Take And Hold\nEven the most potent enemy force can be undone with sufficient preparation. Lay minefields, dig trenches and draw the\nenemy into pre‑prepared killing zones.\nANY BATTLE ROUND - End of your turn.\nFor each terrain area trapped this turn.\n2VP\nFor each of those terrain areas that is an objective.\n3VP\nANY BATTLE ROUND - End of your turn.\nOne or more enemy units that started the turn within a terrain area were destroyed, if that terrain area\nis trapped.\n3VP\nSECOND BATTLE ROUND ONWARDS - End of your Command phase (or the end of your turn in the fifth battle round).\nYou control one or more objectives (excluding your home objective).\n4VP\nSweeping Engagement\nTake and Hold / Disruption - Layout A\nHammer and Anvil\nTake and Hold / Disruption - Layout C\nCrucible Of Battle\nTake and Hold / Disruption - Layout B\nACTION: BOOBY TRAP","source":"Primary Missions _ 40k.app.pdf","source_label":"Chapter Approved 2026–2027 (as printed in supplied PDF)","review_status":"Pending edition/validity review"},{"name":"Purge And Secure","matchup":"Take And Hold Vs Reconnaissance","rules_text":"Take And Hold Vs Reconnaissance\nEnemy pickets and reconnaissance have engaged your vanguard. Move forward, seize defensive positions and repel the\nassault at all costs.\nANY BATTLE ROUND - End of your turn.\nOne or more enemy units were destroyed this turn by a friendly unit that was within range of one or\nmore objectives.\n3VP\nOne or more enemy units that started the turn within range of one or more objectives were destroyed\nthis turn.\n3VP\nSECOND BATTLE ROUND ONWARDS - End of your Command phase (or the end of your turn in the fifth battle round).\nFor each objective you control (excluding your home objective).\n4VP\nSECOND BATTLE ROUND ONWARDS - End of your turn.\nYou control one or more objectives you did not control at the start of the turn (excluding your\nhome objective).\n3VP\nTipping Point\nTake and Hold / Reconnaissance - Layout A\nDawn Of War\nTake and Hold / Reconnaissance - Layout B\nSearch and Destroy\nTake and Hold / Reconnaissance - Layout C","source":"Primary Missions _ 40k.app.pdf","source_label":"Chapter Approved 2026–2027 (as printed in supplied PDF)","review_status":"Pending edition/validity review"}],"deployments":[{"matchup":"Take And Hold Vs Take And Hold","played_with_mission":"Battlefield Dominance","layout_options":["A","B","C"],"source":"Deployments _ 40k.app.pdf","diagram_note":"The supplied PDF contains diagrams; exact coordinates are not digitised in this data export.","review_status":"Pending visual verification"},{"matchup":"Take And Hold Vs Disruption","played_with_mission":"","layout_options":["A","B","C"],"source":"Deployments _ 40k.app.pdf","diagram_note":"The supplied PDF contains diagrams; exact coordinates are not dig <script>
window.__startApp=function(){
const D=JSON.parse(document.getElementById('d').textContent),F=D.factions,U=D.units,$=i=>document.getElementById(i);
const S={ex:{},gs:1,setup:false,pend:null,tab:'u',fi:0,fshow:false,lf:'',ld:'',fac:'',q:'',role:'',lg:false,sel:null,list:[],ds:[]};
try{S.list=JSON.parse(LS.getItem('wh40k11list')||'[]').map(x=>typeof x==='string'?{id:x}:x).filter(x=>x&&U[x.id])}catch(e){}
try{const m=JSON.parse(LS.getItem('wh40k11meta')||'{}');S.lf=m.lf||'';S.ds=Array.isArray(m.ds)?m.ds.filter(Boolean):(m.ld?[m.ld]:[]);S.ld=S.ds[0]||'';S.gs=typeof m.gs==='number'?m.gs:1}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>esc(s).replace(/\^\^(.+?)\^\^/g,'<b>$1</b>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
const tier=u=>u.tiers.length?u.tiers.map(t=>`${t[1]} pts at ${t[0]}+ models`).join(', '):'';
const ord=r=>['Epic Hero','Character'].indexOf(r)<0?9:['Epic Hero','Character'].indexOf(r);
// faction select
const fs=$('fac');fs.innerHTML='<option value="">All factions</option>';
const gr={};Object.keys(F).sort().forEach(k=>{const p=k.split(' - ');const g=p.length>1?p[0]:'Other';(gr[g]=gr[g]||[]).push([k,p.slice(1).join(' - ')||k])});
Object.keys(gr).forEach(g=>{const o=document.createElement('optgroup');o.label=g;gr[g].forEach(([k,l])=>{const x=document.createElement('option');x.value=k;x.textContent=`${l} (${F[k].length})`;o.appendChild(x)});fs.appendChild(o)});
function pool(){const ids=S.fac?F[S.fac]:[...new Set(Object.values(F).flat())];return ids.map(i=>U[i]).filter(u=>S.lg||!u.lg)}
function match(u,q){if(!q)return true;const h=(u.n+' '+u.kw.join(' ')+' '+u.w.map(w=>w.n).join(' ')).toLowerCase();return q.toLowerCase().split(/\s+/).every(t=>h.includes(t))}
function render(){
 $('chips').style.display=S.tab==='u'?'':'none';if(S.tab!=='u'){renderFx();return}
 const p=pool(),roles=[...new Set(p.map(u=>u.role||'Other'))].sort((a,b)=>ord(a)-ord(b)||a.localeCompare(b));
 if(S.role&&!roles.includes(S.role))S.role='';
 $('chips').innerHTML=['',...roles].map(r=>`<button class="chip ${S.role===r?'on':''}" data-r="${esc(r)}">${r||'All'}</button>`).join('');
 const L=p.filter(u=>(!S.role||(u.role||'Other')===S.role)&&match(u,S.q)).sort((a,b)=>ord(a.role)-ord(b.role)||(a.role||'').localeCompare(b.role||'')||a.n.localeCompare(b.n));
 let h='',last=null;L.forEach(u=>{const r=u.role||'Other';if(r!==last){h+=`<div class="rh">${esc(r)}</div>`;last=r}h+=`<div class="it ${S.sel===u.id?'on':''}" data-id="${u.id}"><span>${esc(u.n)}</span><span class="rt"><small>${u.pts?u.pts+' pts':''}</small><button class="add" data-add="${u.id}" title="Add to my list" aria-label="Add ${esc(u.n)} to my list">+</button></span></div>`});
 $('list').innerHTML=h||'<div class="empty">No units match.</div>';
 $('ln').textContent=S.list.length;
}
function wt(ws,m){if(!ws.length)return'';return`<div class="sc"><table><tr><th>${m?'Melee':'Ranged'}</th><th>Range</th><th>A</th><th>${m?'WS':'BS'}</th><th>S</th><th>AP</th><th>D</th></tr>`+ws.map(w=>`<tr><td>${esc(w.n)}${w.kw?`<div class="k">${esc(w.kw)}</div>`:''}</td><td>${esc(w.Range)}</td><td>${esc(w.A)}</td><td>${esc(m?w.WS:w.BS)}</td><td>${esc(w.S)}</td><td>${esc(w.AP)}</td><td>${esc(w.D)}</td></tr>`).join('')+'</table></div>'}
function card(){
 if(S.tab!=='u'){fxCard();return}
 const u=U[S.sel];$('m').classList.toggle('sel',!!u);
 if(!u){$('card').innerHTML='<div class="empty">Select a unit to view its datasheet.</div>';return}
 const seen=new Set(),st=u.st.filter(s=>{const k=JSON.stringify(s);if(seen.has(k))return false;seen.add(k);return true});
 const inl=S.list.includes(u.id)&&false;
 let h=`<button class="back" id="bk">← Back</button><div class="sheet"><div class="top"><div><div class="r">${esc(u.role)}</div><h2>${esc(u.n)}</h2></div><div class="pts">${u.pts?u.pts+' pts':'—'}<small>${esc(tier(u))}</small></div></div>`;
 h+=`<div class="sec sc"><table class="st"><tr><th>Model</th><th>M</th><th>T</th><th>Sv</th><th>W</th><th>Ld</th><th>OC</th><th>Inv</th></tr>`+st.map(s=>`<tr><td>${esc(s.n)}</td><td>${esc(s.M)}</td><td>${esc(s.T)}</td><td>${esc(s.Sv)}</td><td>${esc(s.W)}</td><td>${esc(s.LD)}</td><td>${esc(s.OC)}</td><td>${esc(s.InSv)||'–'}</td></tr>`).join('')+'</table></div>';
 const R=u.w.filter(w=>!w.m),M=u.w.filter(w=>w.m);

}

 $('saveRoster').addEventListener('click',()=>{const name=$('rosterName').value.trim()||`Roster ${savedRosters.length+1}`;savedRosters.push({name,faction:S.lf,detachment:S.ld,detachments:S.ds.slice(),gameSize:S.gs,list:JSON.parse(JSON.stringify(S.list))});saveCompanion();renderDataModule(root)});root.querySelectorAll('[data-load-roster]').forEach(b=>b.addEventListener('click',()=>{const r=savedRosters[+b.dataset.loadRoster];S.lf=r.faction||'';S.ds=Array.isArray(r.detachments)?r.detachments.slice():(r.detachment?[r.detachment]:[]);S.ld=S.ds[0]||'';S.gs=r.gameSize??1;S.list=JSON.parse(JSON.stringify(r.list||[]));lst();openModule('home');$('lst').classList.add('open')}));root.querySelectorAll('[data-delete-roster]').forEach(b=>b.addEventListener('click',()=>{savedRosters.splice(+b.dataset.deleteRoster,1);saveCompanion();renderDataModule(root)}));$('exportBackup').addEventListener('click',()=>{const payload={version:1,rosters:savedRosters,currentList:S.list,army:{faction:S.lf,detachment:S.ld,detachments:S.ds,gameSize:S.gs}};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='wh40k-backup.json';a.click();URL.revokeObjectURL(url)});$('importBackup').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const p=JSON.parse(await f.text());if(p.rosters)savedRosters=p.rosters;if(p.currentList)S.list=p.currentList;if(p.army){S.lf=p.army.faction||'';S.ds=Array.isArray(p.army.detachments)?p.army.detachments.slice():(p.army.detachment?[p.army.detachment]:[]);S.ld=S.ds[0]||'';S.gs=p.army.gameSize??1}saveCompanion();lst();renderDataModule(root);alert('Backup restored in this browser.')}catch(err){alert('Could not read this backup file.')}})};


};
</script><script>
/* Boot loader: copies hosted outside GitHub Pages fetch the newest data published by the
   daily BSData workflow, then start the app. Falls back to the embedded data on any error. */
(function(){
  var V='__BSDATA_SHA__', BASE='https://piperpb.github.io/wh40k-11e-companion/', done=false;
  function run(){
    if(done)return;done=true;
    window.__startApp();
  }
  if(/github\.io$/.test(location.hostname)||location.protocol==='file:'||!window.fetch){run();return;}
  var t=setTimeout(run,8000);
  fetch(BASE+'data-version.txt',{cache:'no-store'}).then(function(r){return r.ok?r.text():''}).then(function(v){
    v=(v||'').trim();
    if(!/^[0-9a-f]{40}$/.test(v)||v===V){clearTimeout(t);run();return;}
    return fetch(BASE+'data.json?v='+v).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(j){
      if(done)return;var d=JSON.parse(j);if(!d.units||!d.factions)throw 0;
      document.getElementById('d').textContent=j;clearTimeout(t);run();
      var h=document.querySelector('header h1');if(h&&d.meta)h.title='Data: BSData/wh40k-11e '+d.meta.bsdata.slice(0,7)+' ('+d.meta.bsdata_date+') \u00b7 fetched live from GitHub Pages';
    });
  }).catch(function(){clearTimeout(t);run();});
})();
</script></body></html>
