<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMT Exam Study Portal</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #10b981;
      --border: #e2e8f0;
      --danger: #ef4444;
      --warning: #f59e0b;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    [data-theme="dark"] {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --accent: #34d399;
      --border: #334155;
      --danger: #f87171;
      --warning: #fbbf24;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
      line-height: 1.5;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      box-shadow: var(--shadow);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-content {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--primary);
    }

    #dark-mode-toggle {
      background: var(--bg-color);
      border: 1px solid var(--border);
      color: var(--text-color);
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.875rem;
    }

    #dark-mode-toggle:hover {
      border-color: var(--primary);
    }

    .container {
      max-width: 900px;
      margin: 2.5rem auto;
      padding: 0 1.5rem;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      margin-top: 0;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .subtitle {
      color: var(--text-muted);
      margin-bottom: 2rem;
      font-size: 1rem;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.25rem;
    }

    .module-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: left;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .module-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      border-color: var(--primary);
    }

    .module-card.accent {
      border-left: 4px solid var(--primary);
    }

    .module-card h3 {
      margin: 0 0 0.5rem 0;
      color: var(--primary);
      font-size: 1.15rem;
    }

    .module-card p {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Quiz Screen Styles */
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      background: var(--card-bg);
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    #progress-indicator {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .question-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow);
    }

    .question-card h3 {
      margin-top: 0;
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.6;
    }

    .choices-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    .choice-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .cross-btn {
      background: var(--bg-color);
      border: 1px solid var(--border);
      color: var(--danger);
      font-weight: bold;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .cross-btn:hover {
      background: rgba(239, 68, 68, 0.1);
    }

    .choice-btn {
      flex: 1;
      text-align: left;
      padding: 1rem 1.25rem;
      border: 1px solid var(--border);
      background-color: var(--card-bg);
      color: var(--text-color);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    .choice-btn:hover:not(.crossed) {
      border-color: var(--primary);
      background-color: rgba(37, 99, 235, 0.03);
    }

    .choice-btn.selected {
      border-color: var(--primary);
      background-color: rgba(37, 99, 235, 0.1);
      font-weight: 600;
    }

    .choice-btn.crossed {
      text-decoration: line-through;
      opacity: 0.4;
      background-color: var(--bg-color);
      cursor: not-allowed;
    }

    .quiz-footer {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
    }

    .btn-primary, .btn-secondary {
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      border: none;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-primary:active, .btn-secondary:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-color);
    }

    .btn-secondary:hover {
      border-color: var(--text-muted);
    }

    /* Image Box */
    .image-box {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      padding: 1.25rem;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow);
    }

    .image-box img {
      max-width: 100%;
      max-height: 280px;
      border-radius: 6px;
    }

    .img-placeholder {
      color: var(--danger);
      font-weight: 600;
      border: 2px dashed var(--danger);
      padding: 1.5rem;
      border-radius: 8px;
      background: rgba(239, 68, 68, 0.03);
    }

    .hidden {
      display: none !important;
    }

    /* Results Screen */
    .score-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      padding: 2.5rem;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow);
    }

    .score-card h1 {
      font-size: 3.5rem;
      margin: 0.5rem 0 0 0;
      color: var(--primary);
    }

    .results-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    #missed-container {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: var(--shadow);
    }

    /* Modal */
    .modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 16px;
      width: 90%;
      max-width: 420px;
      border: 1px solid var(--border);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
    }

    .modal-content input[type="number"] {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border);
      background: var(--bg-color);
      color: var(--text-color);
      border-radius: 8px;
      font-size: 1rem;
      margin-top: 0.5rem;
    }

    .section-checkboxes {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin: 1.25rem 0;
      background: var(--bg-color);
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .section-checkboxes label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      font-weight: 500;
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <h1>EMT Exam Study Portal</h1>
      <button id="dark-mode-toggle" aria-label="Toggle Dark Mode">🌙 Dark Mode</button>
    </div>
  </header>

  <main class="container">
    <!-- HOME SCREEN -->
    <section id="home-screen" class="screen active">
      <h2>Study Modules</h2>
      <p class="subtitle">Select a section or quiz mode below to begin reviewing.</p>
      
      <div class="card-grid">
        <button class="module-card" onclick="startSectionQuiz(1)">
          <h3>Section 1</h3>
          <p>Roles, Legal, A&amp;P, Lifespan</p>
        </button>
        <button class="module-card" onclick="startSectionQuiz(2)">
          <h3>Section 2 &amp; 3</h3>
          <p>Assessment &amp; Airway</p>
        </button>
        <button class="module-card" onclick="startSectionQuiz(4)">
          <h3>Section 4</h3>
          <p>Medical Emergencies &amp; Pharmacology</p>
        </button>
        <button class="module-card" onclick="startSectionQuiz(5)">
          <h3>Section 5</h3>
          <p>Trauma, Bleeding &amp; Environmental</p>
        </button>
        <button class="module-card" onclick="startSectionQuiz(6)">
          <h3>Section 6</h3>
          <p>OB/GYN &amp; Pediatrics</p>
        </button>
        <button class="module-card accent" onclick="startQuickQuiz()">
          <h3>⚡ Quick Random</h3>
          <p>10 Random Questions</p>
        </button>
        <button class="module-card accent" onclick="startAllQuiz()">
          <h3>📚 All Questions</h3>
          <p>Comprehensive Review</p>
        </button>
        <button class="module-card accent" onclick="openCustomModal()">
          <h3>⚙️ Custom Quiz</h3>
          <p>Choose count &amp; sections</p>
        </button>
      </div>
    </section>

    <!-- QUIZ SCREEN -->
    <section id="quiz-screen" class="screen">
      <div class="quiz-header">
        <button class="btn-secondary" onclick="returnHome()">🏠 Home</button>
        <span id="progress-indicator">Question 1 of 10</span>
        <button id="flag-btn" class="btn-secondary" onclick="toggleFlag()">🚩 Flag</button>
      </div>

      <div id="image-container" class="image-box hidden"></div>

      <div class="question-card">
        <h3 id="question-text">Loading question...</h3>
        <div id="choices-container" class="choices-list"></div>
      </div>

      <div class="quiz-footer">
        <button id="prev-btn" class="btn-secondary" onclick="prevQuestion()">Previous</button>
        <button id="next-btn" class="btn-primary" onclick="nextQuestion()">Next</button>
      </div>
    </section>

    <!-- RESULTS SCREEN -->
    <section id="results-screen" class="screen">
      <h2>Quiz Results</h2>
      <div class="score-card">
        <p id="score-text" style="color: var(--text-muted); margin: 0;">You scored 0 out of 0</p>
        <h1 id="percentage-text">0%</h1>
      </div>

      <div class="results-actions">
        <button class="btn-primary" onclick="restartQuiz()">🔄 Retake Quiz</button>
        <button class="btn-secondary" onclick="retryMissed()" id="retry-missed-btn">🔁 Retry Missed / Flagged</button>
        <button class="btn-secondary" onclick="returnHome()">🏠 Back to Home</button>
      </div>

      <div id="missed-container">
        <h3 style="margin-top: 0;">Review Missed Questions</h3>
        <div id="missed-list"></div>
      </div>
    </section>
  </main>

  <!-- CUSTOM QUIZ MODAL -->
  <div id="custom-modal" class="modal hidden">
    <div class="modal-content">
      <h3 style="margin-top:0;">Create Custom Quiz</h3>
      <label for="custom-count" style="font-size: 0.9rem; font-weight: 500;">Number of Questions:</label>
      <input type="number" id="custom-count" value="10" min="1" max="100">
      
      <div class="section-checkboxes">
        <label><input type="checkbox" name="sec-chk" value="1" checked> Section 1</label>
        <label><input type="checkbox" name="sec-chk" value="2" checked> Section 2 &amp; 3</label>
        <label><input type="checkbox" name="sec-chk" value="4" checked> Section 4</label>
        <label><input type="checkbox" name="sec-chk" value="5" checked> Section 5</label>
        <label><input type="checkbox" name="sec-chk" value="6" checked> Section 6</label>
      </div>

      <div class="modal-buttons">
        <button class="btn-secondary" onclick="closeCustomModal()">Cancel</button>
        <button class="btn-primary" onclick="startCustomQuiz()">Start Quiz</button>
      </div>
    </div>
  </div>

      {
        id: "sec2_1", section: 2, number: 1,
        text: "Which of the following means of taking a blood pressure may result in the EMT not being able to obtain a diastolic pressure.",
        choices: ["Invasive blood pressure monitoring", "Auscultation", "Automated", "Palpation"], correct: 3, image: null
      },
